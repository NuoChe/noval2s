[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novel2script"
version = "0.1.0"
description = "AI-assisted novel to screenplay conversion tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Novel2Script Team" }]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "ruamel.yaml>=0.18",
    "litellm>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "opencc-python-reimplemented>=0.1.7",
]

[project.scripts]
novel2script = "novel2script.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/novel2script"]

[tool.hatch.build.targets.sdist]
include = ["src/novel2script", "docs", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring real LLM API key",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
