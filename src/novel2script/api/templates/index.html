<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel2Script — AI 小说转剧本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="/" class="topbar__brand">Novel2Script</a>
      <div class="topbar__actions">
        <span id="auth-logged-out">
          <button type="button" class="btn btn-ghost btn-sm" id="login-open-btn">登录</button>
        </span>
        <span id="auth-logged-in" hidden>
          <span class="topbar__user" id="user-email"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="logout-btn">退出</button>
        </span>
      </div>
    </header>

    <header class="hero">
      <h1 class="hero__title">Novel2Script</h1>
      <p class="hero__subtitle">上传 3 章以上的小说文本，AI 自动转换为结构化 YAML 剧本初稿</p>
      <ul class="hero__steps">
        <li class="hero__step"><span class="hero__step-num">1</span>登录并选模型</li>
        <li class="hero__step"><span class="hero__step-num">2</span>上传 TXT / MD</li>
        <li class="hero__step"><span class="hero__step-num">3</span>下载 YAML</li>
      </ul>
    </header>

    <section class="panel">
      <h2 class="panel__heading">选择 AI 模型</h2>
      <p class="panel__hint" style="color: var(--ink-muted); font-size: 0.875rem; margin-top: 0.25rem;">
        仅显示已在服务器 <code>.env</code> 中配置 API Key 的模型
      </p>
      <div id="model-grid" class="model-grid"></div>
    </section>

    <section class="panel panel--locked" id="convert-panel">
      <h2 class="panel__heading">开始转换</h2>
      <form id="convert-form">
        <div class="field-row">
          <div class="field">
            <label for="title">作品标题（可选）</label>
            <input type="text" id="title" name="title" placeholder="自动从第一章推断">
          </div>
          <div class="field">
            <label for="author">作者（可选）</label>
            <input type="text" id="author" name="author" placeholder="未知作者">
          </div>
        </div>

        <div class="field">
          <label for="file">小说文件</label>
          <div class="upload-zone">
            <div class="upload-zone__icon">📄</div>
            <p class="upload-zone__hint">点击或拖拽上传 · TXT / MD · UTF-8</p>
            <p class="upload-zone__filename" id="file-label">尚未选择文件</p>
            <input type="file" id="file" name="file" accept=".txt,.md" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">开始转换</button>
      </form>
      <div id="status" class="status"></div>
    </section>

    <section class="panel panel--result" id="result-card" style="display:none">
      <h2 class="panel__heading">转换结果</h2>
      <div id="report" class="stats-bar"></div>
      <textarea id="yaml-output" class="yaml-panel" readonly style="display:none"></textarea>
      <div class="actions">
        <button type="button" id="download-btn" class="btn btn-ghost">下载 YAML</button>
        <button type="button" id="copy-btn" class="btn btn-ghost">复制内容</button>
      </div>
    </section>

    <footer class="footer-meta">
      模型 <strong id="footer-model">{{ settings.llm_model }}</strong>
      · 用户 <strong id="footer-user">未登录</strong>
      · 最少 3 章 · YAML Schema v1.0
    </footer>
  </div>

  <div class="modal-overlay" id="auth-modal" hidden role="dialog" aria-labelledby="auth-title">
    <div class="modal">
      <button type="button" class="modal__close" aria-label="关闭">&times;</button>
      <div class="modal__tabs">
        <button type="button" class="modal__tab modal__tab--active" data-tab="login">登录</button>
        <button type="button" class="modal__tab" data-tab="register">注册</button>
      </div>
      <form id="auth-form" class="modal__body">
        <div class="field">
          <label for="auth-email">邮箱</label>
          <input type="email" id="auth-email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="auth-password">密码</label>
          <input type="password" id="auth-password" required minlength="6" autocomplete="current-password">
        </div>
        <p class="modal__error" id="auth-error" hidden aria-live="polite"></p>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">登录</button>
      </form>
    </div>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/models.js"></script>
  <script>
    const form = document.getElementById('convert-form');
    const status = document.getElementById('status');
    const resultCard = document.getElementById('result-card');
    const yamlOutput = document.getElementById('yaml-output');
    const reportDiv = document.getElementById('report');
    const submitBtn = document.getElementById('submit-btn');
    const fileInput = document.getElementById('file');
    const fileLabel = document.getElementById('file-label');
    let downloadFilename = 'screenplay.yaml';
    let elapsedTimer = null;

    fileInput.addEventListener('change', () => {
      fileLabel.textContent = fileInput.files[0]?.name || '尚未选择文件';
    });

    function formatDuration(totalSec) {
      const sec = Math.max(0, Math.round(totalSec));
      if (sec < 60) return sec + 's';
      if (sec < 3600) {
        const minutes = Math.floor(sec / 60);
        const seconds = sec % 60;
        return seconds > 0 ? `${minutes}m ${seconds}s` : `${minutes}m`;
      }
      const hours = Math.floor(sec / 3600);
      const minutes = Math.floor((sec % 3600) / 60);
      const seconds = sec % 60;
      const parts = [`${hours}h`];
      if (minutes > 0) parts.push(`${minutes}m`);
      if (seconds > 0) parts.push(`${seconds}s`);
      return parts.join(' ');
    }

    function startElapsedTimer() {
      const startTime = Date.now();
      setStatus('loading', `转换中，已耗时 ${formatDuration(0)}…`);
      elapsedTimer = setInterval(() => {
        const elapsedSec = (Date.now() - startTime) / 1000;
        setStatus('loading', `转换中，已耗时 ${formatDuration(elapsedSec)}…`);
      }, 1000);
    }

    function stopElapsedTimer() {
      if (elapsedTimer) {
        clearInterval(elapsedTimer);
        elapsedTimer = null;
      }
    }

    function renderStats(report) {
      const badges = [
        { label: '状态', value: report.status, extra: 'stat-badge--status' },
        { label: '场次', value: report.stats.scenes },
        { label: '角色', value: report.stats.characters },
        { label: '警告', value: report.stats.warnings },
        { label: '耗时', value: formatDuration(report.duration_sec) },
      ];
      reportDiv.innerHTML = badges.map(b => `
        <div class="stat-badge ${b.extra || ''}">
          <span class="stat-badge__label">${b.label}</span>
          <span class="stat-badge__value">${b.value}</span>
        </div>
      `).join('');
    }

    function setStatus(type, message) {
      status.className = 'status' + (type ? ' status--' + type : '');
      status.textContent = message;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!AUTH.requireAuth()) return;

      const modelId = MODELS.getSelectedId();
      if (!modelId) {
        setStatus('error', '请先选择可用模型（需配置 API Key）');
        return;
      }

      startElapsedTimer();
      submitBtn.disabled = true;
      submitBtn.textContent = '转换中…';
      resultCard.style.display = 'none';

      const formData = new FormData(form);
      formData.set('model_id', modelId);

      try {
        const resp = await fetch('/api/convert', {
          method: 'POST',
          body: formData,
          credentials: 'include',
        });
        const data = await resp.json();
        if (resp.status === 401) {
          AUTH.openModal('login');
          throw new Error('请先登录');
        }
        if (!resp.ok) throw new Error(data.detail || 'Conversion failed');

        downloadFilename = data.filename || 'screenplay.yaml';
        yamlOutput.value = data.yaml_content;
        yamlOutput.style.display = 'block';

        renderStats(data.report);
        resultCard.style.display = 'block';
        setStatus('success', '转换完成');
      } catch (err) {
        let message = err.message;
        if (message.includes('Insufficient Balance')) {
          message = 'LLM 账户余额不足，请充值后重试';
        }
        setStatus('error', '错误：' + message);
      } finally {
        stopElapsedTimer();
        submitBtn.disabled = false;
        submitBtn.textContent = '开始转换';
      }
    });

    document.getElementById('download-btn').addEventListener('click', () => {
      const blob = new Blob([yamlOutput.value], { type: 'text/yaml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = downloadFilename;
      a.click();
    });

    document.getElementById('copy-btn').addEventListener('click', async () => {
      await navigator.clipboard.writeText(yamlOutput.value);
      setStatus('success', '已复制到剪贴板');
    });
  </script>
</body>
</html>
